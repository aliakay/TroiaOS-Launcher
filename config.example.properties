# TroiaOS settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Your city, for the weather and the sunset that turns the interface dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# The city name shown with the weather (empty = "Weather").
city=

# Your name, for the greeting at the top left (empty = just "Hello").
name=

# The dock's apps, by package, in order (empty = the known streaming apps that are installed). Everything here can
# also be changed on the TV: hold OK on an app in the dock, or Settings → Customize.
# e.g. com.netflix.ninja,com.google.android.youtube.tv,com.disney.disneyplus
dock=

# How the home screen shows the apps: dock (a glass bar at the bottom) or list (big names over the photo, on the
# left). Also on the TV: Settings → Customize → Home Screen.
layout=dock

# auto (follows the TV's language), en or tr. It can also be switched on the TV: Settings → Language.
language=auto

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# The markets panel: Yahoo Finance symbols, comma-separated; ":label" sets the name shown.
# e.g. ^GSPC:SPX,BTC-USD:BTC,GC=F:XAU,TSLA,NVDA,AAPL   (empty = no markets button)
# Yahoo's chart data is public but unofficial (no key; it may run ~15 min late): meant for personal use.
stocks=

# Guest Wi-Fi: the QR code phones scan to join. Better set on the TV (Customize → Guest Wi-Fi QR), where the
# password is kept encrypted; these are only a starting value. They stay in your config.properties, never in git.
guest_wifi_ssid=
guest_wifi_password=
# WPA (WPA/WPA2/WPA3), WEP, or nopass for an open network
guest_wifi_security=WPA

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Not used by this home screen (kept from Free My TV, which showed TMDB picks and crypto prices).
tmdb_key=
tmdb_region=US
currency=USD
